name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js for Snyk CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Security Scans
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          chmod +x gradlew
          if [ -n "$SNYK_TOKEN" ]; then
            echo "Running Snyk Open Source test on backend..."
            snyk test || true
            echo "Running Snyk Code test on backend..."
            snyk code test || true
          else
            echo "SNYK_TOKEN secret is not set. Skipping Snyk scan."
          fi

  backend-test:
    name: Backend Test (JUnit, JaCoCo & SonarCloud)
    runs-on: ubuntu-latest
    needs: [gitleaks, security]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository (Full Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Generate JaCoCo Coverage Report
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Run SonarCloud Scanner for Backend
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=VisualDatacenter-Backend
            -Dsonar.projectName="Visual Datacenter Backend"
            -Dsonar.sources=backend/src/main/java
            -Dsonar.tests=backend/src/test/java
            -Dsonar.java.binaries=backend/build/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.exclusions=**/build/**,**/.gradle/**

      - name: Upload Build & Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/
          retention-days: 1
          if-no-files-found: ignore

  backend-build:
    name: Backend Build Artifact
    runs-on: ubuntu-latest
    needs: backend-test

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Application Jar
        run: ./gradlew build -x test --no-daemon
