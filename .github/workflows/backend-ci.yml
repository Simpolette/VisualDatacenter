name: Backend CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js for Snyk CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Snyk Security Scans
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN secret is not set. Failing build to prevent insecure merge."
            exit 1
          fi

          echo "Running Snyk Open Source test..."
          snyk test --severity-threshold=high

          echo "Running Snyk Code test..."
          snyk code test --severity-threshold=high

  test:
    runs-on: ubuntu-latest
    needs: [gitleaks, security]

    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository (Full Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Verify 80% Coverage (JaCoCo)
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Publish Test Report
        uses: dorny/test-reporter@v2.6.0
        if: always()
        with:
          name: Backend Unit Test Results
          path: 'backend/build/test-results/test/TEST-*.xml'
          reporter: java-junit

      - name: Run Sonar Analysis via Gradle
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon

      - name: Upload Build & Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/
          retention-days: 1
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Application Jar
        run: ./gradlew build -x test --no-daemon
