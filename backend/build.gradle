plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.3.1.8318'
}

sonar {
	properties {
		property "sonar.organization", "simpolette"
		property "sonar.projectKey", "VisualDatacenter"
		property "sonar.projectName", "VisualDatacenter"
		property "sonar.coverage.jacoco.xmlReportPaths", "${project.buildDir}/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.exclusions", "**/build/**,**/.gradle/**"
	}
}

group = 'com.simpolette.dcv'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('logback.version', '1.5.36')
	set('tomcat.version', '11.0.23')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.snmp4j:snmp4j:3.7.7'

	// Database Migrations (Flyway)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Observability
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

	implementation 'tools.jackson.core:jackson-core:3.1.4'
	implementation 'tools.jackson.core:jackson-databind:3.1.4'

	implementation 'ch.qos.logback:logback-classic:1.5.36'
	implementation 'ch.qos.logback:logback-core:1.5.36'
	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.23'
	implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.23'

	// Security & OAuth2 Resource Server
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	runtimeOnly 'org.postgresql:postgresql:42.7.12'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'net.bytebuddy:byte-buddy:1.15.11'
	testImplementation 'net.bytebuddy:byte-buddy-agent:1.15.11'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs('-Dnet.bytebuddy.experimental=true')
	finalizedBy jacocoTestReport, jacocoTestCoverageVerification
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/*DTO*',
				'**/DcvServerApplication.class',
				'**/Room.class',
				'**/Rack.class',
				'**/Device.class',
				'**/DeviceType.class',
				'**/ModuleType.class',
				'**/Pdu.class',
				'**/EquipmentAlarm.class',
				'**/TelemetryLog.class',
				'**/Interface.class',
				'**/PowerPort.class',
				'**/ConsolePort.class',
				'**/ModuleBay.class',
				'**/Module.class',
				'**/*Template.class'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/*DTO*',
				'**/DcvServerApplication.class',
				'**/Room.class',
				'**/Rack.class',
				'**/Device.class',
				'**/DeviceType.class',
				'**/ModuleType.class',
				'**/Pdu.class',
				'**/EquipmentAlarm.class',
				'**/TelemetryLog.class',
				'**/Interface.class',
				'**/PowerPort.class',
				'**/ConsolePort.class',
				'**/ModuleBay.class',
				'**/Module.class',
				'**/*Template.class'
			])
		}))
	}
}

tasks.named('bootRun') {
    if (file('.env').exists()) {
        file('.env').readLines().each { line ->
            if (!line.trim().startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                environment key.trim(), value.trim()
            }
        }
    }
}
