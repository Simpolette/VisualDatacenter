spring.application.name=DcvServerApplicationTest

# In-Memory H2 Database with PostgreSQL Compatibility Mode for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

telemetry.snmp.host=localhost
telemetry.snmp.port=1161
telemetry.snmp.community=public

telemetry.modbus.host=localhost
telemetry.modbus.port=5502
telemetry.modbus.unit-id=1
