spring.application.name=DcvServerApplication

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true


# ==========================================
# Server Configuration
# ==========================================
server.port=3000

# ==========================================
# Telemetry Hardware Endpoints
# ==========================================
telemetry.snmp.host=${TELEMETRY_SNMP_HOST:localhost}
telemetry.snmp.port=${TELEMETRY_SNMP_PORT:1161}
telemetry.snmp.community=${TELEMETRY_SNMP_COMMUNITY:public}

telemetry.modbus.host=${TELEMETRY_MODBUS_HOST:localhost}
telemetry.modbus.port=${TELEMETRY_MODBUS_PORT:5502}
telemetry.modbus.unit-id=${TELEMETRY_MODBUS_UNIT_ID:1}

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.com.simpolette.dcv=DEBUG

# ==========================================
# CORS Configuration (Enable all origins for development)
# ==========================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600
