spring.application.name=DcvServerApplication

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=true



# ==========================================
# Server Configuration
# ==========================================
server.port=3000

# ==========================================
# Telemetry Hardware Endpoints
# ==========================================
telemetry.snmp.host=${TELEMETRY_SNMP_HOST:localhost}
telemetry.snmp.port=${TELEMETRY_SNMP_PORT:1161}
telemetry.snmp.community=${TELEMETRY_SNMP_COMMUNITY:public}

telemetry.modbus.host=${TELEMETRY_MODBUS_HOST:localhost}
telemetry.modbus.port=${TELEMETRY_MODBUS_PORT:5502}
telemetry.modbus.unit-id=${TELEMETRY_MODBUS_UNIT_ID:1}

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.com.simpolette.dcv=DEBUG

# ==========================================
# CORS Configuration
# ==========================================
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ==========================================
# Security & Keycloak OAuth2 Configuration
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vdt}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/vdt/protocol/openid-connect/certs}

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:vdt}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:vdt-api}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:vdt-api-secret-key-12345}

# ==========================================
# Observability (Actuator & Prometheus)
# ==========================================
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ==========================================
# Distributed Tracing (OpenTelemetry & OTLP Exporter)
# ==========================================
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# ==========================================
# Swagger & OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs


